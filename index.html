<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game Trắc Nghiệm Khoa Học</title>
    <!-- Thư viện hiệu ứng pháo hoa khi trả lời đúng -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #0ea5e9;
            --primary-dark: #0284c7;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        /* Header thông tin & Avatar */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            object-fit: cover;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
        }

        .user-info h3 {
            font-size: 16px;
            color: #38bdf8;
        }

        .user-info p {
            font-size: 13px;
            color: #94a3b8;
        }

        .score-board {
            background: rgba(14, 165, 233, 0.15);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(14, 165, 233, 0.3);
            font-weight: bold;
            color: #38bdf8;
        }

        /* Phần Câu hỏi */
        .quiz-box h2 {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .question-counter {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        /* Các lựa chọn đáp án */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 14px 18px;
            border-radius: 12px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(14, 165, 233, 0.2);
            border-color: var(--primary-color);
            transform: translateX(5px);
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.3) !important;
            border-color: #22c55e !important;
            color: #dcfce7;
        }

        .option-btn.incorrect {
            background: rgba(239, 68, 68, 0.3) !important;
            border-color: #ef4444 !important;
            color: #fee2e2;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        /* Nút chuyển câu / Kết thúc */
        .actions {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: none;
        }

        .next-btn:hover {
            background: var(--primary-dark);
        }

        /* Màn hình kết thúc */
        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        .result-screen p {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .restart-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .restart-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Header -->
        <div class="header">
            <div class="user-profile">
                <!-- Avatar mẫu, bạn có thể thay link ảnh trực tiếp vào src -->
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150" alt="Avatar" class="avatar">
                <div class="user-info">
                    <h3>NGUYỄN NGỌC LINH</h3>
                    <p>Mini Game Khoa Học</p>
                </div>
            </div>
            <div class="score-board">
                Điểm: <span id="score">0</span>
            </div>
        </div>

        <!-- Khung Quiz -->
        <div id="quiz-box" class="quiz-box">
            <div class="question-counter" id="question-counter">Câu hỏi 1 / 8</div>
            <h2 id="question-text">Đang tải câu hỏi...</h2>
            
            <div class="options-list" id="options-list">
                <!-- Các lựa chọn sẽ được render bằng JS -->
            </div>

            <div class="actions">
                <button id="next-btn" class="next-btn" onclick="nextQuestion()">Câu tiếp theo $\rightarrow$</button>
            </div>
        </div>

        <!-- Màn hình tổng kết -->
        <div id="result-screen" class="result-screen">
            <h2>Hoàn thành xuất sắc! 🎉</h2>
            <p id="final-score-text">Bạn đã trả lời đúng X/8 câu hỏi.</p>
            <button class="restart-btn" onclick="restartGame()">Chơi lại từ đầu</button>
        </div>
    </div>

    <script>
        // Dữ liệu 8 câu hỏi đã chọn (đã được đánh số lại từ 1 đến 8)
        const quizData = [
            {
                question: "Tri thức khoa học ở thế kỷ XIX được tích lũy chủ yếu thông qua phương pháp nào?",
                options: [
                    "Suy luận triết học thuần túy",
                    "Quan sát thực nghiệm, thám hiểm, khảo sát thực địa và đo đạc chính xác",
                    "Sách vở và giáo lý tôn giáo",
                    "Kinh nghiệm truyền miệng"
                ],
                correct: 1
            },
            {
                question: "Một đặc điểm nổi bật của khoa học thế kỷ XIX là:",
                options: [
                    "Chỉ dựa vào tư duy triết học",
                    "Hạn chế sử dụng thực nghiệm",
                    "Xây dựng hệ thống phòng thí nghiệm và thiết bị đo đạc ngày càng tinh vi",
                    "Phụ thuộc chủ yếu vào giáo lý tôn giáo"
                ],
                correct: 2
            },
            {
                question: "Ai là nhà khoa học tiêu biểu gắn với hiện tượng cảm ứng điện từ?",
                options: [
                    "Charles Darwin",
                    "Michael Faraday",
                    "Dmitri Mendeleev",
                    "James Watt"
                ],
                correct: 1
            },
            {
                question: "Năm 1869, Dmitri Mendeleev có đóng góp nổi bật nào?",
                options: [
                    "Đề xuất học thuyết tiến hóa",
                    "Phát hiện hiện tượng cảm ứng điện từ",
                    "Xây dựng bảng hệ thống tuần hoàn các nguyên tố hóa học",
                    "Phát minh động cơ đốt trong"
                ],
                correct: 2
            },
            {
                question: "Đặc điểm nổi bật của tri thức khoa học thời Trung cổ là:",
                options: [
                    "Đề cao thực nghiệm và toán học",
                    "Chịu ảnh hưởng lớn của tôn giáo và kinh viện",
                    "Các ngành khoa học đã chuyên môn hóa cao",
                    "Hệ thống phòng thí nghiệm phát triển mạnh"
                ],
                correct: 1
            },
            {
                question: "Bước ngoặt của thế kỷ XIX thể hiện rõ nhất ở sự chuyển biến nào?",
                options: [
                    "Từ thực nghiệm sang suy đoán",
                    "Từ khoa học chuyên môn hóa sang tri thức tổng hợp",
                    "Từ tri thức phân tán sang nghiên cứu chuyên môn hóa, thực nghiệm có hệ thống và đo đạc chính xác",
                    "Từ khoa học sang tôn giáo"
                ],
                correct: 2
            },
            {
                question: "Vì sao thế kỷ XIX được xem là một bước ngoặt quan trọng của khoa học?",
                options: [
                    "Vì khoa học quay lại dựa chủ yếu vào kinh nghiệm",
                    "Vì khoa học ngày càng gắn chặt với sản xuất và công nghệ",
                    "Vì khoa học không còn cần thực nghiệm",
                    "Vì các ngành khoa học bị hợp nhất thành một ngành duy nhất"
                ],
                correct: 1
            },
            {
                question: "Theo nội dung tài liệu, giai đoạn có tốc độ phát triển và tác động mạnh mẽ nhất là:",
                options: [
                    "Thời Cổ đại",
                    "Thời Trung cổ",
                    "Thế kỷ XVII–XVIII",
                    "Thế kỷ XIX"
                ],
                correct: 3
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionCounterEl = document.getElementById("question-counter");
        const questionTextEl = document.getElementById("question-text");
        const optionsListEl = document.getElementById("options-list");
        const nextBtnEl = document.getElementById("next-btn");
        const scoreEl = document.getElementById("score");
        const quizBoxEl = document.getElementById("quiz-box");
        const resultScreenEl = document.getElementById("result-screen");
        const finalScoreTextEl = document.getElementById("final-score-text");

        function loadQuestion() {
            answered = false;
            nextBtnEl.style.display = "none";
            
            const currentQ = quizData[currentQuestionIndex];
            questionCounterEl.innerText = `Câu hỏi ${currentQuestionIndex + 1} / ${quizData.length}`;
            questionTextEl.innerText = currentQ.question;
            
            optionsListEl.innerHTML = "";
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsListEl.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const currentQ = quizData[currentQuestionIndex];
            const allButtons = optionsListEl.querySelectorAll(".option-btn");

            if (selectedIndex === currentQ.correct) {
                selectedBtn.classList.add("correct");
                score += 10;
                scoreEl.innerText = score;
                
                // Hiệu ứng pháo hoa khi trả lời đúng
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            } else {
                selectedBtn.classList.add("incorrect");
                allButtons[currentQ.correct].classList.add("correct");
            }

            // Khóa tất cả các nút sau khi chọn
            allButtons.forEach(btn => btn.disabled = true);
            
            // Hiển thị nút chuyển câu
            nextBtnEl.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizBoxEl.style.display = "none";
            resultScreenEl.style.display = "block";
            const totalCorrect = score / 10;
            finalScoreTextEl.innerText = `Bạn đã trả lời đúng ${totalCorrect}/${quizData.length} câu hỏi. Tổng điểm: ${score}`;
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            scoreEl.innerText = score;
            quizBoxEl.style.display = "block";
            resultScreenEl.style.display = "none";
            loadQuestion();
        }

        // Khởi chạy câu hỏi đầu tiên khi tải trang
        loadQuestion();
    </script>
</body>
</html>
